      <script id=\"browser-logger-active\">\r

      (function() {\r

      \    const ENDPOINT = 'http://127.0.0.1:8000/_boost/browser-logs';\r

      \    const logQueue = [];\r

      \    let flushTimeout = null;\r

      \    const captureTypes = [\"error\",\"warning\",\"info\",\"log\",\"debug\",\"table\"];\r

      \r

      \    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);\r

      \r

      \    // Store original console methods\r

      \    const originalConsole = {\r

      \        log: console.log,\r

      \        debug: console.debug,\r

      \        info: console.info,\r

      \        error: console.error,\r

      \        warn: console.warn,\r

      \        table: console.table\r

      \    };\r

      \r

      \    // Walk own enumerable keys so JSON.stringify cannot auto-invoke a proxy fake toJSON (e.g. Livewire's `$wire`) and fire a real request.\r

      \    function toSafeValue(value, seen) {\r

      \        if (value === null || typeof value !== 'object') {\r

      \            return value;\r

      \        }\r

      \        if (value instanceof Error) {\r

      \            return { name: value.name, message: value.message, stack: value.stack };\r

      \        }\r

      \        // Date has no own enumerable keys, so the walk below would collapse it to {}.\r

      \        if (value instanceof Date) {\r

      \            return value.toISOString();\r

      \        }\r

      \        if (seen.has(value)) {\r

      \            return '[Circular]';\r

      \        }\r

      \        seen.add(value);\r

      \        if (Array.isArray(value)) {\r

      \            return value.map((item) => toSafeValue(item, seen));\r

      \        }\r

      \        const plain = {};\r

      \        for (const key of Object.keys(value)) {\r

      \            if (key === 'toJSON') continue;\r

      \            try {\r

      \                plain[key] = toSafeValue(value[key], seen);\r

      \            } catch (e) {\r

      \                plain[key] = '[Unreadable]';\r

      \            }\r

      \        }\r

      \        return plain;\r

      \    }\r

      \r

      \    // Helper to safely stringify values\r

      \    function safeStringify(obj) {\r

      \        return JSON.stringify(toSafeValue(obj, new WeakSet()));\r

      \    }\r

      \r

      \    // Normalize log type for consistency (e.g., 'warn' to 'warning')\r

      \    function normalizeType(type) {\r

      \        return type === 'warn' ? 'warning' : type;\r

      \    }\r

      \r

      \    // Determine if a log type should be captured based on configured levels\r

      \    function shouldCapture(type) {\r

      \        return captureTypes.includes(normalizeType(type));\r

      \    }\r

      \r

      \    // Batch and send logs\r

      \    function flushLogs() {\r

      \        if (logQueue.length === 0) return;\r

      \r

      \        const batch = logQueue.splice(0, logQueue.length);\r

      \r

      \        fetch(ENDPOINT, {\r

      \            method: 'POST',\r

      \            headers: {\r

      \                'Content-Type': 'application/json',\r

      \                'X-Requested-With': 'XMLHttpRequest'\r

      \            },\r

      \            body: JSON.stringify({ logs: batch })\r

      \        }).catch(err => {\r

      \            // Silently fail to avoid infinite loops\r

      \            originalConsole.error('Failed to send logs:', err);\r

      \        });\r

      \    }\r

      \r

      \    // Debounced flush (100ms)\r

      \    function scheduleFlush() {\r

      \        if (flushTimeout) clearTimeout(flushTimeout);\r

      \        flushTimeout = setTimeout(flushLogs, 100);\r

      \    }\r

      \r

      \    // Intercept console methods\r

      \    ['log', 'debug', 'info', 'error', 'warn', 'table'].forEach(method => {\r

      \        console[method] = function(...args) {\r

      \            // Call original method\r

      \            originalConsole[method].apply(console, args);\r

      \r

      \            // Capture log data\r

      \            try {\r

      \                if (!shouldCapture(method)) {\r

      \                    return;\r

      \                }\r

      \r

      \                logQueue.push({\r

      \                    type: method,\r

      \                    timestamp: new Date().toISOString(),\r

      \                    data: args.map(arg => {\r

      \                        try {\r

      \                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;\r

      \                        } catch (e) {\r

      \                            return String(arg);\r

      \                        }\r

      \                    }),\r

      \                    url: window.location.href,\r

      \                    userAgent: navigator.userAgent\r

      \                });\r

      \r

      \                scheduleFlush();\r

      \            } catch (e) {\r

      \                // Fail silently\r

      \            }\r

      \        };\r

      \    });\r

      \r

      \    // Global error handlers for uncaught errors\r

      \    const originalOnError = window.onerror;\r

      \    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {\r

      \        try {\r

      \            if (shouldCapture('error')) {\r

      \                logQueue.push({\r

      \                    type: 'uncaught_error',\r

      \                    timestamp: new Date().toISOString(),\r

      \                    data: [{\r

      \                        message: errorMsg,\r

      \                        filename: url,\r

      \                        lineno: lineNumber,\r

      \                        colno: colNumber,\r

      \                        error: error ? {\r

      \                            name: error.name,\r

      \                            message: error.message,\r

      \                            stack: error.stack\r

      \                        } : null\r

      \                    }],\r

      \                    url: window.location.href,\r

      \                    userAgent: navigator.userAgent\r

      \                });\r

      \r

      \                scheduleFlush();\r

      \            }\r

      \r

      \        } catch (e) {\r

      \            // Fail silently\r

      \        }\r

      \r

      \        // Call original handler if it exists\r

      \        if (originalOnError && typeof originalOnError === 'function') {\r

      \            return originalOnError(errorMsg, url, lineNumber, colNumber, error);\r

      \        }\r

      \r

      \        // Let the error continue to propagate\r

      \        return false;\r

      \    }\r

      \    window.addEventListener('error', (event) => {\r

      \        try {\r

      \            if (!shouldCapture('error')) {\r

      \                return false;\r

      \            }\r

      \r

      \            logQueue.push({\r

      \                type: 'window_error',\r

      \                timestamp: new Date().toISOString(),\r

      \                data: [{\r

      \                    message: event.message,\r

      \                    filename: event.filename,\r

      \                    lineno: event.lineno,\r

      \                    colno: event.colno,\r

      \                    error: event.error ? {\r

      \                        name: event.error.name,\r

      \                        message: event.error.message,\r

      \                        stack: event.error.stack\r

      \                    } : null\r

      \                }],\r

      \                url: window.location.href,\r

      \                userAgent: navigator.userAgent\r

      \            });\r

      \r

      \            scheduleFlush();\r

      \        } catch (e) {\r

      \            // Fail silently\r

      \        }\r

      \r

      \        // Let the error continue to propagate\r

      \        return false;\r

      \    });\r

      \    window.addEventListener('unhandledrejection', (event) => {\r

      \        try {\r

      \            if (!shouldCapture('error')) {\r

      \                return false;\r

      \            }\r

      \r

      \            logQueue.push({\r

      \                type: 'error',\r

      \                timestamp: new Date().toISOString(),\r

      \                data: [{\r

      \                    message: 'Unhandled Promise Rejection',\r

      \                    reason: toSafeValue(event.reason, new WeakSet())\r

      \                }],\r

      \                url: window.location.href,\r

      \                userAgent: navigator.userAgent\r

      \            });\r

      \r

      \            scheduleFlush();\r

      \        } catch (e) {\r

      \            // Fail silently\r

      \        }\r

      \r

      \        // Let the rejection continue to propagate\r

      \        return false;\r

      \    });\r

      \r

      \    // Flush on page unload\r

      \    window.addEventListener('beforeunload', () => {\r

      \        if (logQueue.length > 0) {\r

      \            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));\r

      \        }\r

      \    });\r

      })();\r

      </script>

